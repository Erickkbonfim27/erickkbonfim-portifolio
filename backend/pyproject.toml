[project]
name = "portfolio"
version = "0.1.0"
description = "Erick Kopak Bonfim's portfolio backend: REST API, remote MCP server and AI agent."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "aio-pika>=10.2.1",
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.123",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.20.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
portfolio = "portfolio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.123",
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PT", "N", "C4", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["portfolio", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs TEST_DATABASE_ADMIN_URL (a real PostgreSQL)"]
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant:UserWarning"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["portfolio"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "^\\s*\\.\\.\\.$"]

[tool.importlinter]
root_package = "portfolio"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Contexts are independent"
type = "independence"
modules = ["portfolio.contexts.identity", "portfolio.contexts.content", "portfolio.contexts.files", "portfolio.contexts.contacts", "portfolio.contexts.ops"]

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
containers = ["portfolio.contexts.identity", "portfolio.contexts.content", "portfolio.contexts.files", "portfolio.contexts.contacts"]
layers = ["interfaces | infrastructure", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Domain is framework-free"
type = "forbidden"
source_modules = ["portfolio.contexts.identity.domain", "portfolio.contexts.content.domain", "portfolio.contexts.files.domain", "portfolio.contexts.contacts.domain", "portfolio.kernel"]
forbidden_modules = ["fastapi", "sqlalchemy", "pydantic", "argon2", "alembic", "aio_pika", "boto3", "httpx", "portfolio.platform"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Application depends only on domain and ports"
type = "forbidden"
source_modules = ["portfolio.contexts.identity.application", "portfolio.contexts.content.application", "portfolio.contexts.files.application", "portfolio.contexts.contacts.application"]
forbidden_modules = ["fastapi", "sqlalchemy", "argon2", "aio_pika", "boto3", "httpx", "portfolio.platform"]
allow_indirect_imports = true
