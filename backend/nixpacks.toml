# Easypanel builds the API with Nixpacks. Set the service's build path to /backend.
# Migrations are not run here on purpose: they are applied by hand (`make migrate`).
#
# Nixpacks writes [variables] into the Dockerfile as `ARG X` + `ENV X=$X` and
# expects `--build-arg` for each one. Easypanel only passes the service's own
# environment variables, so one declared only here arrives empty. Only plan-time
# settings belong in [variables]; whatever a command needs is set inline in it.

providers = ["python"]

[variables]
# Read when Nixpacks plans the build, to pick the Python from Nix.
NIXPACKS_PYTHON_VERSION = "3.13"

[phases.setup]
nixPkgs = ["...", "uv"]

[phases.install]
# --frozen: install exactly what uv.lock says, fail if it is out of date.
# UV_PROJECT_ENVIRONMENT is set because the Python provider points it at
# /opt/venv, and start.sh expects /app/.venv.
cmds = [
  "UV_PROJECT_ENVIRONMENT=/app/.venv UV_COMPILE_BYTECODE=1 uv sync --frozen --no-dev --no-editable",
]

[start]
# The API by default, the worker with PORTFOLIO_ROLE=worker (see start.sh).
cmd = "sh start.sh"
