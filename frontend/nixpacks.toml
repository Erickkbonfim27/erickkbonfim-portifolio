# Easypanel builds the site with Nixpacks. Set the service's build path to /frontend.
#
# Build-time variable (baked into the bundle by Vite):
#   VITE_API_URL   e.g. https://api.yourdomain.dev
# Runtime variables (read by Caddy, see Caddyfile):
#   API_ORIGIN, FILES_ORIGIN   (PORT is set by Easypanel)

providers = ["node"]

# Only plan-time settings belong in [variables]: Easypanel passes the service's own
# environment as build args, so anything declared only here arrives empty in commands.
[variables]
NIXPACKS_NODE_VERSION = "22"
# Nixpacks detects Vite and adds its own Caddy with a default Caddyfile. Ours (CSP,
# AGENTS.md proxy, caching) is used instead; two Caddy packages conflict in Nix.
NIXPACKS_SPA_CADDY = "false"

[phases.setup]
nixPkgs = ["...", "caddy"]

[phases.install]
# Dev dependencies are needed to build (Vite, TypeScript), so include them.
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "caddy run --config Caddyfile --adapter caddyfile"
